name: build

on:
  # Manual only: GitHub-hosted runners cannot reach Harbor through the Cloudflare
  # tunnel (login answers 530), so push and schedule triggers only produce failures.
  # Restore push (branches: [main], paths: base/**, dotnet/**, this file) and the
  # weekly schedule once a runner can reach the registry.
  workflow_dispatch:
    inputs:
      bump:
        description: What this release changes for a consumer (see README, Publishing)
        required: true
        type: choice
        options: [patch, minor, major]

env:
  REGISTRY: harbor.bde-dev.net
  PROJECT: devcontainer-images

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release creation; pins the default token to only this
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      - name: Compute the next version from the published tags
        env:
          BUMP: ${{ inputs.bump }}
          HARBOR_ROBOT_USERNAME: ${{ vars.HARBOR_ROBOT_USERNAME }}
          HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}
        run: |
          for repo in base dotnet; do
            token=$(curl -fsS -u "$HARBOR_ROBOT_USERNAME:$HARBOR_ROBOT_SECRET" \
              "https://$REGISTRY/service/token?service=harbor-registry&scope=repository:$PROJECT/$repo:pull" | jq -r .token)
            curl -fsS -H "Authorization: Bearer $token" \
              "https://$REGISTRY/v2/$PROJECT/$repo/tags/list?n=1000" | jq -r '.tags[]?'
          done > tags
          echo "TAG=$(scripts/next-version "$BUMP" < tags)" >> "$GITHUB_ENV"

      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: base/Dockerfile
          push: true
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/base:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dotnet
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dotnet/Dockerfile
          push: true
          sbom: true
          build-args: |
            BASE=${{ env.REGISTRY }}/${{ env.PROJECT }}/base:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/dotnet:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release ${TAG} already exists — skipping"
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
