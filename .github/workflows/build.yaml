name: build

on:
  push:
    branches: [main]
    paths: ["base/**", "dotnet/**", ".github/workflows/build.yaml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  REGISTRY: harbor.bde-dev.net
  PROJECT: devcontainer-images

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release creation; pins the default token to only this
    steps:
      - uses: actions/checkout@v4

      - name: Compute immutable date tag (YYYY.M.DD)
        run: echo "TAG=$(date +%Y.%-m.%d)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_SECRET }}

      - name: Build and push base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: base/Dockerfile
          push: true
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/base:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push dotnet
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dotnet/Dockerfile
          push: true
          sbom: true
          build-args: |
            BASE=${{ env.REGISTRY }}/${{ env.PROJECT }}/base:${{ env.TAG }}
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/dotnet:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release ${TAG} already exists (same-day rebuild) — skipping"
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
